name: Migration guard

# Protects the dev -> live promotion path. See docs/DEPLOYMENT_DISCIPLINE.md.
#   Rule 1 (parity)  : the repo and staging never disagree.
#   Rule 2 (purity)  : migrations change schema, never repair data.

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/ci/**'
      - '.github/workflows/migration-guard.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

jobs:
  purity:
    name: Migrations contain schema only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check migration purity
        run: ./scripts/ci/check-migrations.sh

  parity:
    name: Staging matches the repo
    runs-on: ubuntu-latest
    # Skipped automatically on forks and wherever the secrets are absent, so the
    # workflow never fails for a missing credential.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check staging parity
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "SUPABASE_ACCESS_TOKEN / SUPABASE_STAGING_REF not configured — skipping."
            echo "Add them under Settings > Secrets and variables > Actions to enable this gate."
            exit 0
          fi
          ./scripts/ci/check-staging-parity.sh
